# Copier vers : /etc/apache2/sites-available/sirdashboard.conf
# Puis : a2ensite sirdashboard && systemctl reload apache2
#
# Remplacer SirDashboard.example.local par le FQDN ou l'IP du serveur.

<VirtualHost *:80>
    ServerName SirDashboard.example.local
    ServerAdmin admin@localhost

    # Fichiers statiques servis directement par Apache
    Alias /static /opt/sirdashboard/static
    <Directory /opt/sirdashboard/static>
        Options -Indexes
        Require all granted
    </Directory>

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass /static !
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/sirdashboard-error.log
    CustomLog ${APACHE_LOG_DIR}/sirdashboard-access.log combined
</VirtualHost>

