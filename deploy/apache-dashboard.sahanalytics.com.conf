# /etc/apache2/sites-available/dashboard.sahanalytics.com.conf
# Activer SANS désactiver les autres sites :
#   a2ensite dashboard.sahanalytics.com.conf
#   systemctl reload apache2

<VirtualHost *:80>
    ServerName dashboard.sahanalytics.com
    ServerAdmin admin@sahanalytics.com

    # Fichiers statiques servis par Apache
    Alias /static /var/www/html/dashboard/static
    <Directory /var/www/html/dashboard/static>
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    Timeout 180
    ProxyTimeout 180
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass /static !
    ProxyPass / http://127.0.0.1:8010/
    ProxyPassReverse / http://127.0.0.1:8010/

    ErrorLog ${APACHE_LOG_DIR}/dashboard.sahanalytics.com-error.log
    CustomLog ${APACHE_LOG_DIR}/dashboard.sahanalytics.com-access.log combined
</VirtualHost>

# Après : certbot --apache -d dashboard.sahanalytics.com
# Certbot ajoutera le vhost :443. Dans .env mettre alors :
#   SESSION_COOKIE_SECURE=true
# et remplacer X-Forwarded-Proto par "https" (certbot le gère souvent tout seul).
