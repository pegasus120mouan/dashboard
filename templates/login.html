<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SirDashboard — Connexion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-brand">
                <div class="login-brand-icon"><i class="fa-solid fa-shield-halved"></i></div>
                <h1>SirDashboard</h1>
                <p>Centre opérationnel de sécurité · LogRhythm</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="login-alert {% if category == 'error' %}error{% else %}info{% endif %}">
                            <i class="fa-solid fa-circle-exclamation"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('auth.login') }}" method="POST">
                <div class="login-field">
                    <label for="username">Identifiant</label>
                    <div class="login-input-wrap">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" name="username" required autocomplete="username" placeholder="ex. analyste@soc">
                    </div>
                </div>
                <div class="login-field">
                    <label for="password">Mot de passe</label>
                    <div class="login-input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" class="login-submit">Accéder au SOC</button>
            </form>

            <div class="login-foot">Accès restreint à l’équipe SOC</div>
        </div>
    </div>
</body>
</html>
